# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

active:
  token_hash: <%= Infra::TokenHashing.digest("token-active") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.from_now %>

expired:
  token_hash: <%= Infra::TokenHashing.digest("token-expired") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.ago %>

revoked:
  token_hash: <%= Infra::TokenHashing.digest("token-revoked") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.from_now %>
  revoked_at: <%= 1.hour.ago %>
