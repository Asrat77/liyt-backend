# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

active:
  token_hash: <%= Infra::TokenHashing.digest("token-active") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.from_now %>
  family: user-family

driver_active:
  token_hash: <%= Infra::TokenHashing.digest("token-driver") %>
  owner: one
  owner_type: Driver
  expires_at: <%= 1.day.from_now %>
  family: driver-family

customer_active:
  token_hash: <%= Infra::TokenHashing.digest("token-customer") %>
  owner: customer_one
  owner_type: User
  expires_at: <%= 1.day.from_now %>
  family: customer-family

expired:
  token_hash: <%= Infra::TokenHashing.digest("token-expired") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.ago %>
  family: user-family

revoked:
  token_hash: <%= Infra::TokenHashing.digest("token-revoked") %>
  owner: one
  owner_type: User
  expires_at: <%= 1.day.from_now %>
  revoked_at: <%= 1.hour.ago %>
  family: user-family
